<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Preço do Anonimato · ao vivo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;800&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Palco escuro de evento: Grafite como chão, um gradiente por tela, Hanken + uma palavra em Instrument Serif itálico */
:root{
  --grafite:#191919; --ardosia:#4A4643; --pedra:#8A837C; --nevoa:#F1EEEA; --papel:#FBFAF8;
  --magenta:#E11FCB; --rosa:#EC4FA6; --coral:#F5994B;
  --grad:linear-gradient(120deg,#E11FCB 0%,#EC4FA6 45%,#F5994B 100%);
  --linha:rgba(241,238,234,.12); --trilho:rgba(241,238,234,.08);
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--grafite);color:var(--nevoa);font-family:var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.it{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--rosa);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* ================= TELÃO ================= */
#telao{position:fixed;inset:0;overflow:hidden;background:#0f0f0f}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--grafite);overflow:hidden}
.slide{position:absolute;inset:0;padding:96px 120px 120px;display:flex;flex-direction:column;animation:entra .45s ease both}
@keyframes entra{from{opacity:.0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;min-height:48px}
.eyebrow{font-size:26px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--pedra);display:flex;align-items:center;gap:18px}
.eyebrow::before{content:"";width:14px;height:14px;background:var(--coral);transform:rotate(45deg)}
.votos-box{display:flex;align-items:center;gap:24px;text-align:right}
.votos-box b{display:block;font-size:44px;font-weight:800;letter-spacing:.02em}
.votos-box small{display:block;font-size:22px;letter-spacing:.12em;color:var(--pedra);text-transform:uppercase}
.qr-mini{background:var(--papel);padding:16px;border-radius:10px;line-height:0}
.qr-mini svg{display:block;width:120px;height:120px}
.rodape{position:absolute;left:120px;right:120px;bottom:44px;display:flex;justify-content:space-between;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--ardosia)}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.02;text-wrap:balance}
h1 .it,h2 .it{font-size:1.12em;letter-spacing:-.01em}
.h-xl{font-size:150px}
.h-l{font-size:104px}
.h-m{font-size:76px}
.lead{font-size:40px;line-height:1.35;color:var(--pedra);font-weight:300;max-width:1300px;margin:0;text-wrap:balance}
.lead strong{color:var(--nevoa);font-weight:600}
.fonte{font-size:20px;color:var(--ardosia);letter-spacing:.04em;margin-top:auto}
.centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px}

/* capa */
.capa{display:grid;grid-template-columns:1fr 520px;gap:80px;align-items:center;flex:1}
.capa .tag{font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:var(--pedra)}
.capa h1{font-size:176px;margin-top:28px}
.capa .sub{font-size:38px;font-weight:300;color:var(--pedra);margin-top:36px;line-height:1.35;max-width:980px}
.entrar{border:1px solid var(--linha);border-radius:28px;padding:44px;display:flex;flex-direction:column;align-items:center;gap:28px;background:rgba(241,238,234,.03)}
.entrar .qr{background:var(--papel);padding:34px;border-radius:18px;line-height:0}
.entrar .qr svg{display:block;width:340px;height:340px}
.entrar p{margin:0;font-size:30px;text-align:center;line-height:1.3}
.entrar .url{font-size:28px;font-weight:600;letter-spacing:.02em;color:var(--nevoa);overflow-wrap:anywhere;text-align:center}
.assina{font-size:30px;font-weight:600;margin-top:56px}
.assina span{color:var(--pedra);font-weight:300}

/* enquete */
.enquete{flex:1;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:56px}
.poll{display:flex;flex-direction:column;gap:26px}
.row{display:grid;grid-template-columns:520px 1fr 130px;gap:32px;align-items:center}
.row .lbl{font-size:36px;font-weight:600;line-height:1.15}
.track{height:54px;background:var(--trilho);border-radius:10px;overflow:hidden;position:relative}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(241,238,234,.32);border-radius:10px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.row.lead-op .track i{background:var(--grad)}
.row .pct{font-size:44px;font-weight:800;text-align:right}
.row.lead-op .lbl{color:var(--papel)}
.row:not(.lead-op) .lbl,.row:not(.lead-op) .pct{color:var(--pedra)}
.aguarda{font-size:30px;color:var(--pedra)}

/* três orçamentos */
.orcs{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:48px}
.orc{border:1px solid var(--linha);border-radius:24px;padding:40px;display:flex;flex-direction:column;align-items:stretch;gap:14px;background:rgba(241,238,234,.03)}
.orc .n{font-size:26px;letter-spacing:.2em;color:var(--pedra)}
.orc .v{font-size:84px;font-weight:800;letter-spacing:-.02em}
.orc ul{margin:6px 0 0;padding:0;list-style:none;font-size:28px;color:var(--pedra);line-height:1.5}
.orc .bar{margin-top:auto;padding-top:22px;display:flex;align-items:center;gap:20px}
.orc .bar .track{flex:1;height:22px}
.orc .bar .pct{font-size:40px;font-weight:800;min-width:110px;text-align:right}
.orc.lead-op{border-color:transparent;background:linear-gradient(var(--grafite),var(--grafite)) padding-box,var(--grad) border-box;border:2px solid transparent}
.orc.lead-op .track i{background:var(--grad)}
.nd-linha{margin-top:34px;font-size:32px;color:var(--pedra);display:flex;gap:18px;align-items:baseline}
.nd-linha b{color:var(--nevoa);font-size:44px}

/* A vs B */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;flex:1;min-height:0}
.card{border-radius:26px;padding:40px 44px;display:flex;flex-direction:column;gap:20px;min-height:0}
.card.a{background:var(--nevoa);color:var(--grafite)}
.card.b{background:#232222;border:1px solid var(--linha)}
.card .letra{flex:none;width:60px;height:60px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:34px}
.card.a .letra{background:var(--grafite);color:var(--nevoa)}
.card.b .letra{background:var(--nevoa);color:var(--grafite)}
.card .desc{font-size:31px;line-height:1.35;margin:0}
.card.a .desc{color:var(--ardosia)}
.card .desc strong{font-weight:800}
.card.a .desc strong{color:var(--grafite)}
.card .cab{display:flex;gap:24px;align-items:flex-start}
.mini{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.mrow{display:grid;grid-template-columns:270px 1fr 96px;gap:20px;align-items:center;font-size:26px;font-weight:600}
.mrow .track{height:30px}
.card.a .mrow .track{background:rgba(25,25,25,.08)}
.card.a .mrow .track i{background:rgba(25,25,25,.28)}
.card.a .mrow.lead-op .track i{background:var(--grafite)}
.card.b .mrow.lead-op .track i{background:var(--grad)}
.mrow .pct{text-align:right;font-weight:800;font-size:30px}
.media{font-size:24px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.media b{font-size:44px;letter-spacing:0;margin-left:12px}
.card.a .media{color:var(--ardosia)}
.card.a .media b{color:var(--grafite)}
.faixa{margin-top:36px;border-radius:22px;background:#0d0d0d;padding:30px 48px;display:flex;justify-content:space-between;align-items:center;gap:40px}
.faixa p{margin:0;font-size:40px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.faixa .mult{font-size:88px;font-weight:800;white-space:nowrap}

/* dados */
.dados{display:grid;grid-template-columns:repeat(3,1fr);gap:56px;margin-top:64px}
.dado .n{font-size:132px;font-weight:800;letter-spacing:-.03em;line-height:1}
.dado p{font-size:32px;color:var(--pedra);line-height:1.35;margin:18px 0 0}
.dados.duo{grid-template-columns:1fr 1fr}

/* frases */
.frase{flex:1;display:flex;flex-direction:column;justify-content:center;gap:48px}
.preto{background:#000!important}

/* rosto história padrão */
.ativos{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-block:auto}
.ativo{border-top:2px solid var(--linha);padding-top:32px;display:flex;flex-direction:column;gap:16px}
.ativo .k{font-size:64px;font-weight:800;letter-spacing:-.02em}
.ativo .q{font-size:28px;color:var(--pedra);text-transform:uppercase;letter-spacing:.14em}
.ativo .caso{font-size:30px;line-height:1.4;color:var(--pedra);margin-top:18px}
.ativo .caso b{color:var(--nevoa);font-weight:600}
.ativo .moral{font-size:40px;line-height:1.2;margin-top:auto;padding-top:36px;font-weight:600}

/* nuvem */
.nuvem{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:18px 46px;padding:20px 60px}
.nuvem span{font-weight:800;line-height:1.05;letter-spacing:-.01em;animation:entra .5s ease both;color:var(--pedra)}
.nuvem span.top{font-family:var(--serif);font-style:italic;font-weight:400;color:transparent;padding-inline:.08em}

/* fecho */
.fecho{display:grid;grid-template-columns:1fr 460px;gap:80px;align-items:center;flex:1}
.fecho .entrar .qr svg{width:300px;height:300px}
.lista{display:flex;flex-direction:column;gap:20px;margin-top:40px;font-size:36px;color:var(--pedra)}
.lista b{color:var(--nevoa)}

.status{position:absolute;right:28px;bottom:22px;width:10px;height:10px;border-radius:50%;background:var(--ardosia)}
.status.on{background:#3a3}
.aviso{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:var(--papel);color:var(--grafite);padding:22px 36px;border-radius:14px;font-size:28px;font-weight:600;z-index:5;box-shadow:0 10px 40px rgba(0,0,0,.4)}

/* ================= PLATEIA (celular) ================= */
#plateia{min-height:100%;display:flex;flex-direction:column;padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.p-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--pedra);padding-bottom:18px;border-bottom:1px solid var(--linha)}
.p-top b{color:var(--nevoa);font-weight:600}
.p-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:28px}
.p-espera h1{font-size:40px;line-height:1.05}
.p-espera p{font-size:17px;line-height:1.5;color:var(--pedra);margin:0}
.p-pulse{width:12px;height:12px;border-radius:50%;background:var(--grad);animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.p-pulse{animation:none}}
.p-q{display:flex;flex-direction:column;gap:12px}
.p-q + .p-q{margin-top:22px;padding-top:22px;border-top:1px solid var(--linha)}
.p-q .rot{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);font-weight:600}
.p-q h2{font-size:28px;line-height:1.15;letter-spacing:-.01em}
.p-q .ctx{font-size:15px;line-height:1.5;color:var(--pedra);margin:0}
.p-op{display:block;width:100%;text-align:left;padding:17px 18px;border-radius:14px;border:1px solid var(--linha);background:rgba(241,238,234,.04);font-size:17px;font-weight:600;min-height:56px;transition:background .15s,border-color .15s}
.p-op:active{background:rgba(241,238,234,.1)}
.p-op[disabled]{opacity:.55;cursor:default}
.p-op.sel{opacity:1;border-color:transparent;background:linear-gradient(#262525,#262525) padding-box,var(--grad) border-box;border:1px solid transparent}
.p-ok{font-size:15px;color:var(--pedra);display:flex;gap:10px;align-items:center}
.p-ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral)}
.p-word{display:flex;gap:10px}
.p-word input{flex:1;min-width:0;font:inherit;font-size:20px;padding:15px 16px;border-radius:14px;border:1px solid var(--linha);background:rgba(241,238,234,.06);color:var(--nevoa)}
.p-btn{border:0;border-radius:14px;padding:0 22px;font-weight:800;font-size:16px;background:var(--grad);color:#fff;min-height:54px}
.p-erro{font-size:14px;color:var(--coral);margin:0}
.p-rod{font-size:12px;color:var(--ardosia);text-align:center;letter-spacing:.06em}

/* ================= ROTEIRO (celular da palestrante) ================= */
#roteiro{height:100%;height:100dvh;display:flex;flex-direction:column;gap:16px;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
.r-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--pedra)}
.r-top .relogio{font-size:30px;font-weight:800;color:var(--nevoa)}
.r-top .relogio.atras{color:var(--coral)}
.r-tit{font-size:26px;font-weight:800;line-height:1.15}
.r-meta{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pedra)}
.r-notas{flex:1;min-height:0;font-size:19px;line-height:1.55;color:var(--nevoa);background:rgba(241,238,234,.04);border:1px solid var(--linha);border-radius:16px;padding:18px 20px;overflow:auto}
.r-notas p{margin:0 0 12px}
.r-notas .se{color:var(--coral);font-weight:600}
.r-vivo{font-size:15px;color:var(--pedra);display:flex;flex-direction:column;gap:6px}
.r-vivo b{color:var(--nevoa)}
.r-prox{font-size:14px;color:var(--pedra)}
.r-bts{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.r-bts button{min-height:70px;border-radius:16px;border:1px solid var(--linha);background:rgba(241,238,234,.05);font-size:18px;font-weight:800}
.r-bts .prox{background:var(--grad);border:0;color:#fff}
.r-zerar{background:none;border:0;color:var(--ardosia);font-size:13px;text-decoration:underline;align-self:center;padding:8px}
.r-conf{display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;color:var(--coral)}
.r-conf button{border:1px solid var(--coral);background:none;border-radius:10px;padding:8px 14px;color:var(--coral);font-weight:600}
</style>
</head>
<body>

<div id="telao" hidden><div class="stage" id="stage"></div></div>
<main id="plateia" hidden></main>
<main id="roteiro" hidden></main>

<script>

  sessao: "ducake",
  publico: "https://jaquelinebosa.com.br/ao-vivo",   // endereço onde esta página fica no ar (o QR aponta para cá)

};
const qs = new URLSearchParams(location.search);

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function brl(n){return "R$ " + Math.round(n).toLocaleString("pt-BR")}
function conta(p){
  const m = VOTOS[p] || new Map(); const by = {};
  for (const v of m.values()) by[v] = (by[v]||0) + 1;
  return {total:m.size, by};
}
function addVoto(r){ (VOTOS[r.pergunta] ||= new Map()).set(r.dispositivo, r.opcao); }

/* ===== Conexão ===== */
function conectar(){
  try { sb = supabase.createClient(CFG.url, CFG.anon, {auth:{persistSession:false}}); }
  catch(e){ sb = null; }
}
async function carregarSessao(){
  if (!sb) return;
  const {data, error} = await sb.from("sessao").select("slide,abertas").eq("id", CFG.sessao).maybeSingle();
  if (!error && data){ online = true; aoMudarSessao(data); } else online = false;
  marcarStatus();
}
async function carregarVotos(){
  if (!sb) return;
  let q = sb.from("votos").select("pergunta,dispositivo,opcao").eq("sessao", CFG.sessao);
  if (MODO === "plateia") q = q.eq("dispositivo", idDispositivo());   // o celular só precisa saber dos próprios votos
  const {data, error} = await q.range(0, 9999);
  if (error) return;
  for (const k of Object.keys(VOTOS)) delete VOTOS[k];
  data.forEach(addVoto);
  aoMudarVotos();
}
function assinar(){
  if (!sb) return;
  const ch = sb.channel("palestra-" + CFG.sessao)
    .on("postgres_changes", {event:"*", schema:"public", table:"sessao", filter:"id=eq." + CFG.sessao}, p => { if (p.new) aoMudarSessao(p.new); });
  if (MODO !== "plateia") ch.on("postgres_changes", {event:"INSERT", schema:"public", table:"votos", filter:"sessao=eq." + CFG.sessao}, p => { addVoto(p.new); aoMudarVotos(); });
  ch.subscribe(st => { if (st === "SUBSCRIBED"){ online = true; marcarStatus(); } });
}
async function controlar(i){
  const abertas = SLIDES[i].abre || [];
  if (!sb || !CHAVE) return false;
  const {data, error} = await sb.rpc("controlar", {p_sessao:CFG.sessao, p_chave:CHAVE, p_slide:i, p_abertas:abertas});
  if (error || data !== 1){ avisar(error ? "Sem conexão com a votação. Os slides seguem funcionando." : "Chave inválida: confira o link."); return false; }
  return true;
}
async function zerar(){
  if (!sb || !CHAVE) return;
  const {data, error} = await sb.rpc("zerar", {p_sessao:CFG.sessao, p_chave:CHAVE});
  if (error || data !== 1){ avisar("Não consegui zerar. Confira a conexão e a chave."); return; }
  for (const k of Object.keys(VOTOS)) delete VOTOS[k];
  inicioRelogio = null;
  aoMudarSessao({slide:0, abertas:SLIDES[0].abre});
  aoMudarVotos();
  avisar("Votos zerados. Tudo pronto para começar.");
}

function iniciarTelao(){
  document.getElementById("telao").hidden = false;
  const stage = document.getElementById("stage");
  const ajustar = () => { const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; };
  addEventListener("resize", ajustar); ajustar();

  let avisoT;
  avisar = (msg) => {
    let el = stage.querySelector(".aviso"); if (!el){ el = document.createElement("div"); el.className = "aviso"; stage.appendChild(el); }
    el.textContent = msg; clearTimeout(avisoT); avisoT = setTimeout(() => el.remove(), 3500);
  };
  marcarStatus = () => { const d = stage.querySelector(".status"); if (d) d.classList.toggle("on", online); };

  function desenhar(){
    const s = SLIDES[atual];
    stage.innerHTML = `<section class="slide${s.id==="preto"?" preto":""}">${TELAS[s.id]()}${s.id==="preto"?"":rodape(atual)}</section><span class="status"></span>`;
    stage.querySelectorAll("[data-qr]").forEach(qr);
    marcarStatus();
    aoMudarVotos();
  }
  aoMudarVotos = () => atualizarResultados(stage);
  aoMudarSessao = (d) => {
    SESSAO = {slide:d.slide, abertas:d.abertas||[]};
    if (d.slide !== atual && d.slide >= 0 && d.slide < SLIDES.length){ atual = d.slide; desenhar(); }
  };
  async function ir(i){
    i = Math.max(0, Math.min(SLIDES.length-1, i));
    if (i === atual) return;
    atual = i; desenhar();
    await controlar(i);
  }
  let pedeZerar = false;
  addEventListener("keydown", e => {
    if (e.key === "f" || e.key === "F"){ document.documentElement.requestFullscreen?.().catch(()=>{}); return; }
    if (!CHAVE) return;   // sem chave o telão só espelha o roteiro
    if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); ir(atual+1); }
    if (["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); ir(atual-1); }
    if (e.key === "Home") ir(0);
    if (e.key === "z" || e.key === "Z"){
      if (pedeZerar){ pedeZerar = false; zerar(); } else { pedeZerar = true; avisar("Zerar todos os votos? Aperte Z de novo para confirmar."); setTimeout(()=>pedeZerar=false, 3500); }
    }
  });
  desenhar();
}

function atualizarResultados(root){
  root.querySelectorAll("[data-poll]").forEach(box => {
    const {total, by} = conta(box.dataset.poll);
    let max = 0; for (const v of Object.values(by)) max = Math.max(max, v);
    box.querySelectorAll("[data-op]").forEach(row => {
      const n = by[row.dataset.op] || 0, pct = total ? Math.round(n*100/total) : 0;
      const i = row.querySelector(".track i"); if (i) i.style.width = pct + "%";
      const t = row.querySelector(".pct"); if (t) t.textContent = pct + "%";
      row.classList.toggle("lead-op", n > 0 && n === max);
    });
  });
  root.querySelectorAll("[data-total]").forEach(el => {
    const n = Math.max(...el.dataset.total.split(",").map(p => conta(p).total));
    el.textContent = n + (n === 1 ? " voto" : " votos");
  });
  const media = p => { const {total, by} = conta(p); if (!total) return null; let s = 0; for (const [k,v] of Object.entries(by)) s += (MEIO[k]||0)*v; return s/total; };
  root.querySelectorAll("[data-media]").forEach(el => { const m = media(el.dataset.media); el.textContent = m ? brl(m) : "·"; });
  root.querySelectorAll("[data-mult]").forEach(el => {
    const a = media("preco_a"), b = media("preco_b"), na = conta("preco_a").total, nb = conta("preco_b").total;
    if (!a || !b || na < 3 || nb < 3){ el.innerHTML = `<span class="g">aguardando votos</span>`; return; }
    const r = b / a;
    el.innerHTML = `<span class="g">${r.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})}× mais caro</span>`;
  });
  root.querySelectorAll("[data-cloud]").forEach(el => {
    const {total, by} = conta(el.dataset.cloud);
    if (!total) return;
    const lista = Object.entries(by).sort((x,y) => y[1]-x[1]).slice(0, 40);
    const max = lista[0][1], campea = lista[0];
    // mistura a ordem para a nuvem não virar ranking, com a maior no centro
    const ordem = []; lista.forEach((w,i) => i % 2 ? ordem.push(w) : ordem.unshift(w));
    el.innerHTML = "";
    ordem.forEach(([w,n]) => {
      const s = document.createElement("span");
      s.textContent = w;
      s.style.fontSize = Math.round(40 + 110 * Math.sqrt(n/max)) + "px";
      if (w === campea[0]){ s.className = "top g"; s.style.fontSize = "170px"; }
      else if (n/max > .5) s.style.color = "var(--nevoa)";
      el.appendChild(s);
    });
  });
}

function idDispositivo(){
  try {
    let id = localStorage.getItem("pa-dispositivo");
    if (!id){ id = (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16))); localStorage.setItem("pa-dispositivo", id); }
    return id;
  } catch(e){ return window._pid ||= (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000"); }
}
function limparPalavra(s){
  return s.toLowerCase().normalize("NFC").replace(/[^\p{L}\p{N} -]/gu, "").replace(/\s+/g, " ").trim().split(" ").slice(0, 2).join(" ").slice(0, 24);
}

        const err = erros[p] ? `<p class="p-erro">${esc(erros[p])}</p>` : "";
        if (P.livre){
          if (meu) return `<section class="p-q">${cab}<button class="p-op sel" disabled>${esc(meu)}</button><div class="p-ok">Enviada. Olha a nuvem no telão.</div></section>`;
          return `<section class="p-q">${cab}<form class="p-word" data-p="${p}"><input id="in-${p}" name="w" maxlength="24" autocomplete="off" autocapitalize="none" placeholder="uma palavra" aria-label="Sua palavra" required><button class="p-btn">Enviar</button></form>${err}</section>`;
        }
        const bts = P.ops.map(([id,l]) => `<button class="p-op${meu===id?" sel":""}" data-p="${p}" data-o="${id}" ${meu?"disabled":""}>${esc(l)}</button>`).join("");
        return `<section class="p-q">${cab}${bts}${meu ? `<div class="p-ok">Voto registrado. Olha o resultado no telão.</div>` : ""}${err}</section>`;
      }).join("");
    }
    root.innerHTML = `<div class="p-top"><span><b>O Preço do Anonimato</b></span><span>ao vivo</span></div>
      <div class="p-main">${corpo}</div>
      <div class="p-rod">Jaqueline Bosa · ${esc(CFG.arroba)}</div>`;
  }
  async function votar(p, opcao){
    if (!sb) { erros[p] = "Sem conexão. Tenta de novo em alguns segundos."; render(); return; }
    meus[p] = opcao; delete erros[p]; render();
    const {error} = await sb.from("votos").insert({sessao:CFG.sessao, pergunta:p, dispositivo:eu, opcao});
    if (error && error.code !== "23505"){
      delete meus[p];
      erros[p] = error.code === "42501" ? "Essa votação já fechou. Aguarda a próxima." : "Não foi. Tenta de novo.";
      assinatura = ""; render();
    }
  }
  root.addEventListener("click", e => {
    const b = e.target.closest("button[data-o]"); if (!b || b.disabled) return;
    votar(b.dataset.p, b.dataset.o);
  });
  root.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target; const w = limparPalavra(f.w.value);
    if (!w){ erros[f.dataset.p] = "Escreve uma palavra."; assinatura = ""; render(); return; }
    votar(f.dataset.p, w);
  });
  aoMudarSessao = d => { SESSAO = {slide:d.slide, abertas:d.abertas||[]}; render(); };
  aoMudarVotos = () => {
    let mudou = false;
    for (const p of Object.keys(POLLS)){ const v = VOTOS[p]?.get(eu); if (v && meus[p] !== v){ meus[p] = v; mudou = true; } }
    if (mudou) render();
  };
  render();
}

/* ================= ROTEIRO ================= */
let inicioRelogio = null;
function iniciarRoteiro(){
  const root = document.getElementById("roteiro"); root.hidden = false;
  try { const t = +localStorage.getItem("pa-inicio"); if (t) inicioRelogio = t; } catch(e){}
  let conf = false, msg = "";
  avisar = m => { msg = m; render(); setTimeout(() => { msg = ""; render(); }, 3500); };
  marcarStatus = () => render();

  function render(){
    const s = SLIDES[atual], prox = SLIDES[atual+1];
    const vivo = (s.abre||[]).map(p => `<span>${esc(POLLS[p].q)} <b class="num">${conta(p).total} votos</b></span>`).join("");
    root.innerHTML = `
      <div class="r-top"><span>${online ? "conectado" : "sem conexão"} · ${atual+1}/${SLIDES.length}</span><span class="relogio num" id="relogio">00:00</span></div>
      <div><div class="r-meta">entra em ${fmt(s.min*60)}</div><div class="r-tit">${esc(s.tit)}</div></div>
      ${vivo ? `<div class="r-vivo">${vivo}</div>` : ""}
      <div class="r-notas">${s.notas}</div>
      <div class="r-prox">${prox ? "Próximo: " + esc(prox.tit) : "Último slide."}</div>
      ${msg ? `<div class="r-conf">${esc(msg)}</div>` : ""}
      <div class="r-bts"><button id="ant">Voltar</button><button id="prox" class="prox">Avançar</button></div>
      ${conf ? `<div class="r-conf">Apagar todos os votos? <button id="sim">Sim, zerar</button><button id="nao">Cancelar</button></div>` : `<button class="r-zerar" id="zerar">Zerar votos do ensaio</button>`}`;
    tic();
    root.querySelector("#ant").onclick = () => ir(atual-1);
    root.querySelector("#prox").onclick = () => ir(atual+1);
    const z = root.querySelector("#zerar"); if (z) z.onclick = () => { conf = true; render(); };
    const sim = root.querySelector("#sim"); if (sim) sim.onclick = async () => { conf = false; try{localStorage.removeItem("pa-inicio")}catch(e){} await zerar(); render(); };
    const nao = root.querySelector("#nao"); if (nao) nao.onclick = () => { conf = false; render(); };
  }
  function fmt(seg){ seg = Math.max(0, Math.round(seg)); return String(Math.floor(seg/60)).padStart(2,"0") + ":" + String(seg%60).padStart(2,"0"); }
  function tic(){
    const el = document.getElementById("relogio"); if (!el) return;
    const dec = inicioRelogio ? (Date.now() - inicioRelogio)/1000 : 0;
    el.textContent = fmt(dec);
    const prox = SLIDES[atual+1];
    el.classList.toggle("atras", !!(inicioRelogio && prox && dec > prox.min*60 + 30));
  }
  setInterval(tic, 1000);
  async function ir(i){
    i = Math.max(0, Math.min(SLIDES.length-1, i));
    if (i === atual) return;
    if (!inicioRelogio && i > 0){ inicioRelogio = Date.now(); try{localStorage.setItem("pa-inicio", inicioRelogio)}catch(e){} }
    atual = i; render();
    await controlar(i);
  }
  aoMudarSessao = d => { SESSAO = {slide:d.slide, abertas:d.abertas||[]}; if (d.slide !== atual){ atual = d.slide; } render(); };
  aoMudarVotos = () => { const el = root.querySelector(".r-vivo"); if (el) render(); };
  if (!CHAVE) avisar("Abra o roteiro com a chave no link para controlar o telão.");
  render();
}

/* ===== Início ===== */
(async function(){
  conectar();
  if (MODO === "telao") iniciarTelao();
  else if (MODO === "roteiro") iniciarRoteiro();
  else iniciarPlateia();
  await carregarSessao();
  await carregarVotos();
  assinar();
  // rede de segurança se o tempo real cair: relê a cada poucos segundos
  setInterval(() => { carregarSessao(); if (MODO !== "plateia") carregarVotos(); }, MODO === "plateia" ? 6000 : 4000);
})();
</script>
